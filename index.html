<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Gym | Captain Rehab Adel V15 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
        :root {
            --p-gold: #d4af37; --p-navy: #0a0e17; --p-glass: rgba(255, 255, 255, 0.05); 
            --p-border: rgba(255, 255, 255, 0.1); --p-danger: #ff4d4d; --p-success: #00ff88;
            --p-diamond: #b9f2ff;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--p-navy); color: #fff; margin: 0; overflow-x: hidden; }
        header { padding: 15px 5%; background: rgba(10, 14, 23, 0.95); border-bottom: 2px solid var(--p-gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        .container { max-width: 1300px; margin: 20px auto; padding: 0 20px; }
        .p-card { background: var(--p-glass); border: 1px solid var(--p-border); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .p-input { background: rgba(255,255,255,0.05); border: 1px solid var(--p-border); padding: 12px; border-radius: 12px; color: white; width: 100%; margin-bottom: 12px; box-sizing: border-box; font-family: 'Cairo'; }
        .p-btn { background: var(--p-gold); color: #000; border: none; padding: 10px; border-radius: 10px; font-weight: 900; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .p-btn:hover { opacity: 0.8; transform: translateY(-2px); }
        
        .wa-btn { background: #25d366 !important; color: white !important; padding: 5px 10px; border-radius: 8px; cursor: pointer; border: none; transition: 0.3s; }
        .wa-btn:hover { transform: scale(1.1); background: #1eb954 !important; }

        .diet-box { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--p-gold); border-radius: 15px; padding: 15px; margin-top: 15px; }
        .diet-tag { background: var(--p-gold); color: #000; padding: 2px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
        .diet-list { list-style: none; padding: 0; margin-top: 10px; }
        .diet-list li { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .diet-list li b { color: var(--p-gold); }
        .calories-badge { background: #1a1a1a; border: 1px dashed var(--p-gold); padding: 10px; border-radius: 10px; text-align: center; margin-bottom: 15px; }

        .rank-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-bottom: 10px; }
        .rank-diamond { background: var(--p-diamond); color: #000; box-shadow: 0 0 10px var(--p-diamond); }

        .measure-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 15px; align-items: center; }
        .measure-img { width: 100%; max-height: 450px; object-fit: contain; border-radius: 15px; border: 1px solid var(--p-gold); }
        .measure-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        .chat-area { height: 250px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; }
        .msg.cap { background: var(--p-gold); color: #000; align-self: flex-start; }
        .msg.user { background: rgba(255,255,255,0.1); align-self: flex-end; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        td, th { padding: 12px; background: rgba(255,255,255,0.02); text-align: center; border-radius: 10px; }
        
        #loginPage { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e293b, #0a0e17); }
        .login-box { background: rgba(255,255,255,0.02); backdrop-filter: blur(20px); padding: 30px; border-radius: 30px; width: 380px; border: 1px solid var(--p-border); text-align: center; }
        
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:200; justify-content:center; align-items:center; }
        .modal-content { background:var(--p-navy); width:95%; max-width:750px; padding:25px; border-radius:25px; border:1px solid var(--p-gold); max-height: 95vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="loginPage">
        <div class="login-box">
            <h2 style="color: var(--p-gold);">POWER GYM</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="p-btn" id="btnUserMode" onclick="setMode('user')">دخول البطلة</button>
                <button class="p-btn" id="btnAdminMode" style="background:#333; color:#fff" onclick="setMode('admin')">الكابتن</button>
            </div>
            <input type="text" id="uInp" class="p-input" placeholder="اسم المستخدم">
            <input type="password" id="pInp" class="p-input" placeholder="كلمة المرور">
            <button class="p-btn" onclick="core.login()">دخول المنصة</button>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <header>
            <span id="navUserName" style="font-weight: 900; color:var(--p-gold)"></span>
            <button onclick="location.reload()" class="p-btn" style="width:auto; background:var(--p-danger); color:white; padding:5px 15px;">خروج</button>
        </header>

        <div class="container">
            <div id="adminPanel" style="display: none;">
                <div style="display: grid; grid-template-columns: 1fr 2.5fr; gap: 20px;">
                    <div class="p-card">
                        <h3><i class="fas fa-user-plus"></i> بطلة جديدة</h3>
                        <input type="text" id="mName" class="p-input" placeholder="الاسم">
                        <input type="tel" id="mPhone" class="p-input" placeholder="رقم الواتساب (مثال: 20123456789)">
                        <input type="date" id="mStart" class="p-input">
                        <select id="mGoal" class="p-input">
                            <option value="تخسيس">هدف: تخسيس</option>
                            <option value="زيادة وزن">هدف: زيادة وزن</option>
                            <option value="تأهيل">هدف: تأهيل وإصابة</option>
                        </select>
                        <input type="number" id="mCalories" class="p-input" placeholder="السعرات المحددة">
                        <select id="mDuration" class="p-input">
                            <option value="1">شهر</option><option value="3">3 أشهر</option><option value="6">6 أشهر</option><option value="12">سنة</option>
                        </select>
                        <button class="p-btn" onclick="admin.register()">تفعيل الاشتراك</button>
                    </div>
                    <div class="p-card">
                        <h3>إدارة المشتركات</h3>
                        <table style="font-size: 0.85rem;">
                            <thead><tr><th>البطلة</th><th>الهدف</th><th>إرسال البيانات</th><th>القياسات</th><th>شات</th><th>إجراءات</th></tr></thead>
                            <tbody id="adminTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="userPanel" style="display: none;">
                <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px;">
                    <div>
                        <div class="p-card">
                            <div class="calories-badge">
                                <span style="font-size: 0.9rem; color: #aaa;">السعرات اليومية المستهدفة</span>
                                <div id="userCalories" style="font-size: 2rem; color: var(--p-success); font-weight: 900;">0</div>
                            </div>
                            <h3 style="color:var(--p-gold); margin-bottom:5px;"><i class="fas fa-utensils"></i> برنامجي الغذائي</h3>
                            <div id="dietDisplay" class="diet-box"></div>
                        </div>

                        <div class="p-card">
                            <div id="rankBadgeArea"></div>
                            <h3 style="color:var(--p-gold)"><i class="fas fa-ruler-combined"></i> تحديث قياساتي الحيوية</h3>
                            <div class="measure-grid">
                                <img src="https://d.top4top.io/p_3653sbemj0.png" class="measure-img">
                                <div class="measure-inputs">
                                    <input type="number" id="u_ms_w" class="p-input" placeholder="الوزن">
                                    <input type="number" id="u_ms_ch" class="p-input" placeholder="الصدر">
                                    <input type="number" id="u_ms_wa" class="p-input" placeholder="الخصر">
                                    <input type="number" id="u_ms_hi" class="p-input" placeholder="الأرداف">
                                    <input type="number" id="u_ms_ar" class="p-input" placeholder="الذراع">
                                    <input type="number" id="u_ms_th" class="p-input" placeholder="الفخذ">
                                    <input type="number" id="u_ms_ne" class="p-input" placeholder="الرقبة">
                                    <button class="p-btn" onclick="user.saveMeasures()">حفظ القياسات</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="p-card" style="text-align:center">
                            <h2 id="uPoints" style="color:var(--p-gold); margin:0; font-size:3rem">0</h2><small>نقطة ولاء</small>
                        </div>
                        <div class="p-card">
                            <h3>شات الكابتن</h3>
                            <div id="userChatBox" class="chat-area"></div>
                            <div style="display:flex; gap:5px; margin-top:10px;"><input type="text" id="userMsg" class="p-input" style="margin:0"><button class="p-btn" style="width:60px" onclick="user.send()"><i class="fas fa-paper-plane"></i></button></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>تعديل بيانات المشتركة</h3>
            <input type="text" id="editName" class="p-input">
            <select id="editGoal" class="p-input">
                <option value="تخسيس">تخسيس</option><option value="زيادة وزن">زيادة وزن</option><option value="تأهيل">تأهيل وإصابة</option>
            </select>
            <input type="number" id="editCalories" class="p-input">
            <input type="tel" id="editPhone" class="p-input">
            <input type="date" id="editStart" class="p-input">
            <select id="editMonths" class="p-input">
                <option value="1">1 شهر</option><option value="3">3 أشهر</option><option value="6">6 أشهر</option><option value="12">سنة</option>
            </select>
            <button class="p-btn" onclick="admin.saveEdit()">حفظ التعديلات</button>
            <button class="p-btn" style="background:#444; margin-top:10px" onclick="closeModal('editModal')">إلغاء</button>
        </div>
    </div>

    <div id="adminMeasureModal" class="modal"><div class="modal-content"><h3>تحديث قياسات: <span id="targetName"></span></h3><div class="measure-grid"><img src="https://d.top4top.io/p_3653sbemj0.png" class="measure-img"><div class="measure-inputs"><input type="number" id="adm_ms_w" class="p-input" placeholder="الوزن"><input type="number" id="adm_ms_wa" class="p-input" placeholder="الخصر"><input type="number" id="adm_ms_hi" class="p-input" placeholder="الأرداف"><input type="number" id="adm_ms_ch" class="p-input" placeholder="الصدر"><input type="number" id="adm_ms_ar" class="p-input" placeholder="الذراع"><input type="number" id="adm_ms_th" class="p-input" placeholder="الفخذ"><input type="number" id="adm_ms_ne" class="p-input" placeholder="الرقبة"><button class="p-btn" onclick="admin.saveMeasures()">تحديث</button></div></div><button class="p-btn" style="background:#444; margin-top:10px" onclick="closeModal('adminMeasureModal')">إغلاق</button></div></div>
    <div id="adminChatModal" class="modal"><div class="modal-content"><div id="adminChatBox" class="chat-area"></div><div style="display:flex; gap:5px; margin-top:10px;"><input type="text" id="adminMsgInp" class="p-input" style="margin:0"><button class="p-btn" style="width:70px" onclick="admin.sendReply()">رد</button><button class="p-btn" style="width:50px; background:var(--p-danger)" onclick="closeModal('adminChatModal')">X</button></div></div></div>

<script type="module">
    // --- إعدادات Firebase المدمجة ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC8qS1LqY3Q2P2LmcvM-M3lW9pNBP3o0JU",
        authDomain: "power-gym-c0a65.firebaseapp.com",
        projectId: "power-gym-c0a65",
        storageBucket: "power-gym-c0a65.firebasestorage.app",
        messagingSenderId: "781355588548",
        appId: "1:781355588548:web:0b110ef5b7055731972291",
        measurementId: "G-T7Y43ZKQ8Y",
        databaseURL: "https://power-gym-c0a65-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- المنطق البرمجي للأصلي مع ربط Firebase ---
    window.mode = 'user';
    window.setMode = (m) => { 
        window.mode = m; 
        document.getElementById('btnUserMode').style.background = m === 'user' ? '#d4af37' : '#333'; 
        document.getElementById('btnAdminMode').style.background = m === 'admin' ? '#d4af37' : '#333'; 
    };

    window.closeModal = (id) => { document.getElementById(id).style.display='none'; };

    window.core = {
        activeId: null,
        login: async function() {
            const u = document.getElementById('uInp').value, p = document.getElementById('pInp').value;
            if(window.mode === 'admin' && p === 'cap123') this.showUI('admin', {name:'الكابتن رحاب'});
            else {
                const snap = await get(ref(db, 'members'));
                const members = snap.val() || {};
                const m = Object.values(members).find(x => x.user === u && x.pass === p);
                if(m) { this.activeId = m.id; this.showUI('user', m); } else alert('بيانات خاطئة');
            }
        },
        showUI: function(role, data) {
            document.getElementById('loginPage').style.display='none';
            document.getElementById('mainApp').style.display='block';
            document.getElementById('navUserName').innerText = data.name;
            if(role === 'admin') { document.getElementById('adminPanel').style.display='block'; admin.listen(); }
            else { document.getElementById('userPanel').style.display='block'; user.listen(); }
        }
    };

    window.admin = {
        register: async function() {
            const name = document.getElementById('mName').value, phone = document.getElementById('mPhone').value, 
                  start = document.getElementById('mStart').value, months = parseInt(document.getElementById('mDuration').value),
                  goal = document.getElementById('mGoal').value, calories = document.getElementById('mCalories').value || 0;
            if(!name || !start || !phone) return alert('أكمل البيانات الأساسية');
            const id = Date.now().toString();
            const end = new Date(new Date(start).setMonth(new Date(start).getMonth() + months)).toISOString().split('T')[0];
            const m = {
                id, name, phone, start, end, months, goal, calories, points: 0, chat: [{s:'cap', t:'أهلاً بكِ في عائلتنا!'}], measures: [], unread: false,
                user: 'pg' + Math.floor(100+Math.random()*899), pass: Math.floor(1000+Math.random()*9000).toString()
            };
            await set(ref(db, 'members/' + id), m);
            alert(`تم التفعيل! يوزر البطلة: ${m.user}`);
        },
        listen: function() {
            onValue(ref(db, 'members'), (snap) => {
                const tbody = document.getElementById('adminTable'); tbody.innerHTML = '';
                const members = snap.val() || {};
                Object.values(members).forEach(m => {
                    tbody.innerHTML += `<tr>
                        <td>${m.name}</td><td>${m.goal}</td>
                        <td><button class="wa-btn" onclick="admin.sendToWA('${m.id}')"><i class="fab fa-whatsapp"></i> إرسال</button></td>
                        <td><button class="p-btn" style="padding:4px" onclick="admin.openMeasures('${m.id}')">📏</button></td>
                        <td><button class="p-btn" style="padding:4px; background:${m.unread?'var(--p-danger)':'#0088ff'}" onclick="admin.openChat('${m.id}')">💬</button></td>
                        <td><div style="display:flex; gap:5px; justify-content:center"><i class="fas fa-edit" style="color:var(--p-success); cursor:pointer" onclick="admin.editMember('${m.id}')"></i><i class="fas fa-trash" style="color:var(--p-danger); cursor:pointer" onclick="admin.deleteMember('${m.id}')"></i></div></td>
                    </tr>`;
                });
            });
        },
        sendToWA: async function(id) {
            const s = await get(ref(db, 'members/'+id)); const m = s.val();
            const msg = `أهلاً يا بطلة ${m.name} 💪%0Aبيانات دخولك:%0A👤 يوزر: ${m.user}%0A🔑 باسورد: ${m.pass}%0A🔗 الرابط: ${window.location.href}`;
            window.open(`https://wa.me/${m.phone}?text=${msg}`, '_blank');
        },
        deleteMember: (id) => confirm('حذف المشتركة نهائياً؟') && remove(ref(db, 'members/'+id)),
        editMember: async function(id) { 
            core.activeId = id; const s = await get(ref(db, 'members/'+id)); const m = s.val();
            document.getElementById('editName').value = m.name; document.getElementById('editGoal').value = m.goal;
            document.getElementById('editCalories').value = m.calories; document.getElementById('editPhone').value = m.phone;
            document.getElementById('editStart').value = m.start; document.getElementById('editMonths').value = m.months;
            document.getElementById('editModal').style.display='flex';
        },
        saveEdit: async function() {
            const id = core.activeId;
            const updates = {
                name: document.getElementById('editName').value, goal: document.getElementById('editGoal').value,
                calories: document.getElementById('editCalories').value, phone: document.getElementById('editPhone').value,
                start: document.getElementById('editStart').value, months: parseInt(document.getElementById('editMonths').value)
            };
            updates.end = new Date(new Date(updates.start).setMonth(new Date(updates.start).getMonth() + updates.months)).toISOString().split('T')[0];
            await update(ref(db, 'members/'+id), updates);
            closeModal('editModal');
        },
        openMeasures: async function(id) { 
            core.activeId = id; const s = await get(ref(db, 'members/'+id));
            document.getElementById('targetName').innerText = s.val().name; 
            document.getElementById('adminMeasureModal').style.display='flex'; 
        },
        saveMeasures: async function() {
            const s = await get(ref(db, 'members/'+core.activeId)); const m = s.val();
            const ms = m.measures || [];
            ms.push({ w: document.getElementById('adm_ms_w').value, wa: document.getElementById('adm_ms_wa').value, hi: document.getElementById('adm_ms_hi').value, ch: document.getElementById('adm_ms_ch').value, ar: document.getElementById('adm_ms_ar').value, th: document.getElementById('adm_ms_th').value, ne: document.getElementById('adm_ms_ne').value });
            await update(ref(db, 'members/'+core.activeId), {measures: ms});
            alert('تم التحديث'); closeModal('adminMeasureModal');
        },
        openChat: function(id) { 
            core.activeId = id; update(ref(db, 'members/'+id), {unread: false});
            document.getElementById('adminChatModal').style.display='flex';
            onValue(ref(db, `members/${id}/chat`), (s) => {
                document.getElementById('adminChatBox').innerHTML = (s.val() || []).map(msg=>`<div class="msg ${msg.s}">${msg.t}</div>`).join('');
            });
        },
        sendReply: async function() {
            const inp = document.getElementById('adminMsgInp'); if(!inp.value) return;
            const s = await get(ref(db, `members/${core.activeId}/chat`)); const c = s.val() || [];
            c.push({s:'cap', t:inp.value});
            await update(ref(db, `members/${core.activeId}`), {chat: c});
            inp.value = '';
        }
    };

    window.user = {
        listen: function() {
            onValue(ref(db, 'members/' + core.activeId), (snap) => {
                const m = snap.val(); if(!m) return;
                document.getElementById('uPoints').innerText = m.points;
                document.getElementById('userCalories').innerText = m.calories || 'قيد التحديد';
                const ra = document.getElementById('rankBadgeArea');
                if(m.points > 1000) ra.innerHTML = '<span class="rank-badge rank-diamond">بطلة ماسية 💎</span>';
                else if(m.points > 500) ra.innerHTML = '<span class="rank-badge" style="background:var(--p-gold); color:#000">بطلة ذهبية 🥇</span>';
                else ra.innerHTML = '<span class="rank-badge" style="background:#cd7f32">بطلة برونزية 🥉</span>';
                
                // Diet Logic
                let content = "";
                if(m.goal === 'تخسيس') content = `<span class="diet-tag">نظام حرق الدهون</span><ul class="diet-list"><li><b>الإفطار:</b> بيض مسلوق + خضار.</li><li><b>الغداء:</b> بروتين مشوي + سلطة + كربوهيدرات بسيطة.</li><li><b>العشاء:</b> زبادي يوناني أو تونة.</li></ul>`;
                else if(m.goal === 'زيادة وزن') content = `<span class="diet-tag">نظام الضخامة</span><ul class="diet-list"><li><b>الإفطار:</b> شوفان بالحليب والمكسرات.</li><li><b>الغداء:</b> وجبة متكاملة (بروتين + أرز/مكرونة + دهون صحية).</li><li><b>العشاء:</b> بطاطس وجبن وقريش.</li></ul>`;
                else content = `<span class="diet-tag" style="background:#f1c40f">نظام التأهيل</span><ul class="diet-list"><li><b>التركيز:</b> مضادات التهاب وأوميجا 3.</li><li><b>البروتين:</b> الحفاظ على الكتلة للاستشفاء.</li></ul>`;
                document.getElementById('dietDisplay').innerHTML = content;
                
                document.getElementById('userChatBox').innerHTML = (m.chat || []).map(msg=>`<div class="msg ${msg.s}">${msg.t}</div>`).join('');
            });
        },
        saveMeasures: async function() {
            const s = await get(ref(db, 'members/'+core.activeId)); const m = s.val();
            const ms = m.measures || [];
            ms.push({ w: document.getElementById('u_ms_w').value, wa: document.getElementById('u_ms_wa').value, hi: document.getElementById('u_ms_hi').value, ch: document.getElementById('u_ms_ch').value, ar: document.getElementById('u_ms_ar').value, th: document.getElementById('u_ms_th').value, ne: document.getElementById('u_ms_ne').value });
            await update(ref(db, 'members/'+core.activeId), {measures: ms, points: (m.points || 0) + 10});
            alert('تم الحفظ بنجاح + 10 نقاط ولاء 🏆');
        },
        send: async function() {
            const inp = document.getElementById('userMsg'); if(!inp.value) return;
            const s = await get(ref(db, `members/${core.activeId}/chat`)); const c = s.val() || [];
            c.push({s:'user', t:inp.value});
            await update(ref(db, 'members/'+core.activeId), {chat: c, unread: true});
            inp.value = '';
        }
    };
</script>
</body>
</html>
